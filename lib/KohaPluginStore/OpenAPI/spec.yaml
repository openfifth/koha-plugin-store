openapi: 3.0.1
info:
  title: Koha Plugin Store API
  version: "1"
x-mojo-controller: KohaPluginStore::Controller::Api
components:
  securitySchemes:
    session_auth:
      type: apiKey
      in: cookie
      name: mojolicious
paths:
  /ping:
    get:
      operationId: ping
      x-mojo-to: api#ping
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
  /developer/repos:
    get:
      operationId: developerRepos
      x-mojo-to: api#developer_repos
      security:
        - session_auth: []
      responses:
        '200':
          description: The developer's public GitHub repositories
          content:
            application/json:
              schema:
                type: object
                required:
                  - repos
                properties:
                  repos:
                    type: array
                    items:
                      type: object
                      required:
                        - full_name
                        - html_url
                      properties:
                        full_name:
                          type: string
                        html_url:
                          type: string
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                type: object
  /plugins:
    get:
      operationId: listPlugins
      x-mojo-to: plugins#list_all
      parameters:
        - name: koha_version
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: _page
          in: query
          required: false
          schema:
            type: integer
        - name: _per_page
          in: query
          required: false
          schema:
            type: integer
        - name: _order_by
          in: query
          required: false
          schema:
            type: string
        - name: include_unsupported
          in: query
          required: false
          description: >-
            When true, also return plugins whose releases don't declare
            koha_version as within their koha_min_version/koha_max_version
            range. Used by the discovery UI's "show unsupported plugins" toggle.
          schema:
            type: boolean
      responses:
        '200':
          description: Compatible, published plugins with their compatible releases
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: koha_version is required
          content:
            application/json:
              schema:
                type: object
  /plugins/verify:
    get:
      operationId: verifyPluginDigest
      x-mojo-to: plugins#verify
      parameters:
        - name: digest
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signed manifest, signature, and certification tier for the published version matching this digest
          content:
            application/json:
              schema:
                type: object
        '400':
          description: digest is not a valid sha256 hex string
          content:
            application/json:
              schema:
                type: object
        '404':
          description: no published version found for this digest
          content:
            application/json:
              schema:
                type: object
