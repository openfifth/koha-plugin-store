openapi: 3.0.1
info:
  title: Koha Plugin Store API
  version: "1"
x-mojo-controller: KohaPluginStore::Controller::Api
components:
  securitySchemes:
    session_auth:
      type: apiKey
      in: cookie
      name: mojolicious
paths:
  /ping:
    get:
      operationId: ping
      x-mojo-to: api#ping
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                  - status
  /developer/repos:
    get:
      operationId: developerRepos
      x-mojo-to: api#developer_repos
      security:
        - session_auth: []
      responses:
        '200':
          description: The developer's public GitHub repositories
          content:
            application/json:
              schema:
                type: object
                required:
                  - repos
                properties:
                  repos:
                    type: array
                    items:
                      type: object
                      required:
                        - full_name
                        - html_url
                      properties:
                        full_name:
                          type: string
                        html_url:
                          type: string
        '401':
          description: Not logged in
          content:
            application/json:
              schema:
                type: object
